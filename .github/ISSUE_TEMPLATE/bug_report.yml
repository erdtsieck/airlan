name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing AirLAN. Please do not include passwords, account names, IP or MAC
        addresses, or other personal data.
  - type: input
    id: model
    attributes:
      label: Air conditioner model
      description: The indoor unit model, from the sticker on the unit or the manual.
      placeholder: e.g. SRK25ZS-WF
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: Wi-Fi module and firmware, if known
      description: The module type (for example WF-RAC) and, if you know them, its firmware versions.
      placeholder: e.g. WF-RAC, wireless 010, MCU 131
  - type: dropdown
    id: client
    attributes:
      label: Which AirLAN
      options:
        - Android app
        - Server and web app
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: AirLAN version
      description: Android → Settings → Apps → AirLAN shows the version at the bottom. For the server, the git commit.
      placeholder: e.g. 0.1.3
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and phone
      placeholder: e.g. Android 16, Pixel 8
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Tap ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include the exact error message if there was one. Screenshots help.
    validations:
      required: true
