name: Works with my unit
description: AirLAN works (or partly works) with your air conditioner. This helps others.
labels: [compatibility]
body:
  - type: markdown
    attributes:
      value: Please do not include IP or MAC addresses or other personal data.
  - type: input
    id: model
    attributes:
      label: Air conditioner model
      placeholder: e.g. SRK25ZS-WF
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: Wi-Fi module and firmware, if known
      placeholder: e.g. WF-RAC, wireless 010, MCU 131
  - type: input
    id: app-version
    attributes:
      label: AirLAN version
      placeholder: e.g. 0.1.3
    validations:
      required: true
  - type: checkboxes
    id: works
    attributes:
      label: What works
      options:
        - label: The unit was found on the network
        - label: Switching on and off
        - label: Cooling and heating
        - label: Setting the temperature
        - label: Switch-off timer
        - label: Fan speed and direction
  - type: textarea
    id: notes
    attributes:
      label: Anything that did not work, or notes
