<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AirLAN</title>
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AirLAN">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #16181d; --muted: #6b7280; --line: #e3e5ea;
    --cool: #1d7fe0; --heat: #e8641b; --off: #9aa1ad; --danger: #c62828;
    --accent: var(--off);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --card: #191c22; --text: #eef0f3; --muted: #9098a5; --line: #2a2e36;
            --cool: #4ea3ff; --heat: #ff8a3d; --off: #5d6470; --danger: #ff6b6b; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  main { max-width: 440px; margin: 0 auto; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }

  /* Every unit at a glance: compact tiles, a dot for how each stands, the gear closing the grid. */
  .units { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .tile-row { display: flex; gap: 8px; align-items: stretch; }
  .tile-row > button[role="tab"] { flex: 1 1 0; min-width: 0; min-height: 44px; padding: 8px 12px; border-radius: 12px; background: var(--card);
    border: 1px solid var(--line); display: flex; align-items: flex-start; gap: 8px; text-align: left; }
  .tile-row > button[aria-selected="true"] { border: 2px solid var(--text); padding: 7px 11px; background: color-mix(in srgb, var(--line) 50%, var(--card)); }
  .tile-row > .gear-cell { flex: 1 1 0; display: flex; justify-content: flex-end; align-items: center; }
  .tile-row .gear { width: 44px; height: 44px; align-self: center; }
  /* The dot sits beside the name's first line; the temperature goes below the name when they do not fit together. */
  .tile-dot { flex: 0 0 auto; height: 20px; display: flex; align-items: center; }
  .tile-body { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; justify-content: space-between; column-gap: 6px; line-height: 20px; }
  .tile-name { flex: 1 0 auto; max-width: 100%; font-weight: 550; font-size: 15px; }
  .tile-temp { margin-left: auto; font-size: 14px; font-weight: 550; white-space: nowrap; }
  .tile-temp.cool { color: var(--cool); } .tile-temp.heat { color: var(--heat); }
  .tile-dot .dot { width: 10px; height: 10px; box-sizing: border-box; }
  .dot.on.cool { background: var(--cool); } .dot.on.heat { background: var(--heat); } .dot.on.other { background: var(--text); }
  .dot.unreachable { background: none; border: 1.5px solid var(--danger); }
  .dot.loading { background: none; border: 1.5px solid var(--off); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--off); }
  .dot.cool { background: var(--cool); } .dot.heat { background: var(--heat); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; margin-bottom: 12px; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .name { font-size: 22px; font-weight: 650; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rename { color: var(--muted); padding: 4px; }
  .climate { color: var(--muted); font-size: 14px; margin-top: 2px; }

  .power { width: 56px; height: 56px; border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center;
    background: var(--line); color: var(--muted); transition: background .2s, color .2s; }
  .power.on { background: var(--accent); color: #fff; }
  .power svg { width: 26px; height: 26px; }

  .temp { display: flex; align-items: center; justify-content: space-between; margin: 28px 0 8px; }
  .temp button { width: 64px; height: 64px; border-radius: 50%; border: 1px solid var(--line); font-size: 30px; line-height: 1; }
  .temp button:active:not(:disabled) { background: var(--line); }
  .setpoint { text-align: center; font-variant-numeric: tabular-nums; }
  .setpoint b { font-size: 64px; font-weight: 300; letter-spacing: -2px; color: var(--accent); transition: color .2s; }
  .setpoint small { display: block; color: var(--muted); font-size: 13px; margin-top: -6px; }

  /* The number of columns is set by fitColumns() in app.js. */
  .modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 20px; }
  .modes button { padding: 14px; border-radius: 14px; border: 1px solid var(--line); display: flex;
    align-items: center; justify-content: center; gap: 8px; font-weight: 550; white-space: nowrap; }
  .modes button svg { flex: 0 0 auto; width: 20px; height: 20px; }  /* never squeezed away: then the labels overflow and the buttons stack */
  .modes button[aria-pressed="true"][data-mode="cool"] { background: var(--cool); border-color: var(--cool); color: #fff; }
  .modes button[aria-pressed="true"][data-mode="heat"] { background: var(--heat); border-color: var(--heat); color: #fff; }
  .other-mode { text-align: center; color: var(--muted); font-size: 13px; margin-top: 8px; }

  h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px; }
  .airflow h3 { font-size: 14px; font-weight: 500; color: var(--muted); margin: 16px 0 8px; }
  .airflow h2 + h3 { margin-top: 0; }
  /* Rows of equal buttons; the number of columns is set by fitColumns() in app.js. A label
     may wrap between words (Midden-rechts at the hyphen), never inside one. */
  .seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .seg button { padding: 10px 6px; line-height: 1.25; overflow-wrap: normal; word-break: normal; border-radius: 12px; border: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }
  .chips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .chips button { padding: 10px 6px; white-space: nowrap; border-radius: 12px; border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .chips button:active:not(:disabled) { background: var(--line); }
  .timer-active { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .timer-active b { font-size: 18px; }
  .timer-active .left { color: var(--muted); font-size: 14px; }
  .cancel { padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); }
  .hint { color: var(--muted); font-size: 14px; margin: 0; }

  .status { min-height: 20px; text-align: center; font-size: 14px; color: var(--muted); }
  .status.error, .hint.error { color: var(--danger); }
  .hint.error { margin-bottom: 10px; }
  .gear { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--card);
    display: grid; place-items: center; color: var(--muted); }
  .gear svg { width: 20px; height: 20px; }
  .btn { padding: 10px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); }
  .btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
  .btn.danger { color: var(--danger); }
  input[type=text] { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px; width: 100%; min-width: 0; }
  .field { display: flex; gap: 8px; margin-top: 12px; }
  .field .btn { flex: 0 0 auto; }
  .naming { border-color: var(--cool); }
  /* Name and arrows on one line; the buttons beside them when there is room, else below. */
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line); }
  .row .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .row:first-of-type { border-top: 0; }
  .row .info { flex: 1 1 10em; min-width: 0; }
  .row .info b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .info small { color: var(--muted); display: block; }
  .row .move { display: flex; gap: 4px; }
  .round { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; }
  .round svg { width: 20px; height: 20px; }
  .ident { margin: 8px 0 0; font-size: 14px; }
  .manage-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .manage-head h1 { font-size: 22px; margin: 0; }
</style>
</head>
<body>
<main>
  <nav class="units" role="tablist" id="units" hidden></nav>
  <div id="view"></div>
  <p class="status" id="status" role="status"></p>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
